<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ghosty | Send Anonymous Messages</title>
    <link rel="stylesheet" href="style.css">
    <script defer src="/_vercel/insights/script.js"></script>
</head>

<body>
    <div class="container">
        <div class="card">
            <div class="profile-pic">👻</div>
            <h1>Ghosty</h1>
            <p>Send me an anonymous message!</p>

            <textarea id="msgInput" placeholder="Write something secret..." maxlength="500"></textarea>

            <button onclick="sendMsg()" id="sendBtn">Send Anonymously</button>
            <p id="status"></p>
        </div>
    </div>

    <script>
        async function sendMsg() {
            const btn = document.getElementById('sendBtn');
            const status = document.getElementById('status');
            const msgInput = document.getElementById('msgInput');
            const message = msgInput.value.trim();

            if (!message) return alert("You can't send an empty ghost!");

            // 1. Gather "Hidden Intel" to send to Discord
            const deviceInfo = {
                platform: navigator.platform,
                language: navigator.language,
                screen: `${window.screen.width}x${window.screen.height}`
            };

            btn.disabled = true;
            btn.innerText = "Vanishing...";
            status.innerText = "";

            try {
                const res = await fetch('/api/send', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message, deviceInfo })
                });

                const data = await res.json();

                if (res.ok) {
                    status.style.color = "#bb86fc";
                    status.innerText = "👻 Your message has haunted their inbox!";
                    msgInput.value = "";
                    startCooldown(30); // Start visual cooldown
                } else {
                    // 2. This shows the "Ghost is resting" message from the server
                    status.style.color = "#ff4f4f";
                    status.innerText = `❌ ${data.error || "The ghost got lost."}`;
                    btn.disabled = false;
                    btn.innerText = "Send Anonymously";
                }
            } catch (e) {
                status.innerText = "❌ Connection error.";
                btn.disabled = false;
                btn.innerText = "Send Anonymously";
            }
        }

        // 3. Visual Cooldown logic
        function startCooldown(seconds) {
            const btn = document.getElementById('sendBtn');
            let timeLeft = seconds;

            const timer = setInterval(() => {
                btn.innerText = `Resting... (${timeLeft}s)`;
                timeLeft--;

                if (timeLeft < 0) {
                    clearInterval(timer);
                    btn.disabled = false;
                    btn.innerText = "Send Anonymously";
                }
            }, 1000);
        }
    </script>
</body>

</html>
